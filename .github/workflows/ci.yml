name: Product regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libnetfilter-queue-dev libnfnetlink-dev libmnl-dev nodejs gettext libjson-pp-perl
      - name: Verify sources and integrated product
        run: make test
